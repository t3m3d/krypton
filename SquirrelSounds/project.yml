name: SquirrelSounds
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SquirrelSounds:
    type: application
    platform: iOS
    sources: [SquirrelSounds]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SquirrelSounds
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Squirrel Sounds
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SquirrelSoundsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SquirrelSoundsTests]
    dependencies:
      - target: SquirrelSounds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SquirrelSounds:
    build:
      targets:
        SquirrelSounds: all
    test:
      targets: [SquirrelSoundsTests]
